<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Iniciar Sesión - Visor de Gestión de Tráfico</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tráfico">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="auth-gate" class="standalone-login">
        <div class="auth-gate-box">
            <img src="icons/logo.png" alt="San Salvador Sur Logo" class="auth-gate-logo">
            <span class="auth-gate-brand">San Salvador Sur</span>
            <h2>VGT</h2>
            <span class="auth-gate-subtitle">Visor de Gestión de Tráfico</span>

            <form id="gate-auth-form" onsubmit="submitGateAuthForm(event)">
                <label class="cp-label">Correo Electrónico</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-envelope auth-icon"></i>
                    <input type="email" id="gate-email" class="cp-input" placeholder="usuario@sansalvadorsur.gob.sv"
                        required>
                </div>

                <label class="cp-label">Contraseña</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-lock auth-icon"></i>
                    <input type="password" id="gate-password" class="cp-input has-eye" minlength="6" required
                        placeholder="••••••••">
                    <button type="button" class="auth-eye" id="gate-toggle-eye" title="Mostrar/ocultar contraseña">
                        <i class="fas fa-eye" id="gate-eye-icon"></i>
                    </button>
                </div>

                <button type="submit" class="cp-btn cp-btn-primary" id="gate-submit-btn">
                    Iniciar Sesión &nbsp;<i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <p id="gate-error" class="gate-error hidden"></p>
        </div>

        <p class="auth-gate-note">
            Acceso exclusivo al personal autorizado.<br>
            Las cuentas son administradas por el sistema de San Salvador Sur.
        </p>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/auth.js"></script>
</body>

</html>
